name: Lint & Type Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      
      - name: Lint with Ruff
        run: |
          cd backend
          ruff check .
      
      - name: Type check with Pyright
        run: |
          cd backend
          pyright

  frontend-lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Lint with ESLint
        run: |
          cd frontend
          npm run lint
      
      - name: Type check with TypeScript
        run: |
          cd frontend
          npm run type-check

  lint-summary:
    needs: [backend-lint, frontend-lint]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check lint results
        run: |
          if [ "${{ needs.backend-lint.result }}" != "success" ] || [ "${{ needs.frontend-lint.result }}" != "success" ]; then
            echo "Linting failed"
            exit 1
          fi
          echo "Linting passed ✅"
